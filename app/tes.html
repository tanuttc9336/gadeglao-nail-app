<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="utf-8"/>

<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>Cat Eye Nail – WebGL Demo</title>

<style>

  :root{--bg:#0b0f17; --fg:#cde6ff;}

  html,body{height:100%;margin:0;background:radial-gradient(1200px 800px at 20% 20%, #1a2740 0%, #0f1524 40%, #0b0f17 100%);}

  .wrap{display:grid;place-items:center;height:100%;}

  canvas{width:min(72vmin,520px);height:calc(min(72vmin,520px)*1.45);display:block; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);}

  .hud{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font:14px/1.3 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto; color:var(--fg);opacity:.85;background:rgba(10,14,24,.6);backdrop-filter:blur(6px); padding:10px 14px;border-radius:10px; border:1px solid rgba(255,255,255,.08)}

  .hud b{color:white}

  .brand{position:fixed;top:14px;left:50%;transform:translateX(-50%);font:600 12px/1 ui-sans-serif,system-ui;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.45)}

</style>

</head>

<body>

<div class="wrap">

  <canvas id="gl"></canvas>

</div>

<div class="brand">CAT EYE NAIL – WEBGL</div>

<div class="hud">

  <b>วิธีเล่น</b>: ลากซ้าย/ขวาเพื่อเลื่อนแถบแสง •

  ลากเร็ว = แถบคม/สว่างขึ้น • แตะ/ลากแนวทแยงเพื่อหมุนแนวแถบ • รองรับมือถือ/ทัช

</div>



<script>

(function(){

  const canvas = document.getElementById('gl');

  const dpr = Math.min(2, window.devicePixelRatio || 1);

  let gl = canvas.getContext('webgl', {antialias:true, alpha:false});

  if(!gl){ alert('WebGL not supported'); return; }



  // ---------- Shaders ----------

  const vert = `

  attribute vec2 a_pos;

  void main(){

    gl_Position = vec4(a_pos, 0.0, 1.0);

  }`;



  const frag = `

  precision mediump float;



  uniform vec2  u_res;

  uniform float u_time;

  uniform vec2  u_pointer;      // 0..1 (x,y)

  uniform float u_sigma;        // ridge width

  uniform float u_gain;         // ridge intensity

  uniform float u_trough_gain;  // shadow side bands

  uniform float u_fresnel_pow;  // 3..5

  uniform float u_clearcoat;

  uniform float u_angle;        // radians

  uniform vec3  u_base_dark;    // base colors

  uniform vec3  u_base_tint;



  // --- Helpers ---

  float saturate(float x){return clamp(x,0.0,1.0);}

  vec2  saturate(vec2 v){return clamp(v,0.0,1.0);}



  // value noise ------------------------------------------------------------

  float hash12(vec2 p){

    vec3 p3 = fract(vec3(p.xyx) * 0.1031);

    p3 += dot(p3, p3.yzx + 33.33);

    return fract((p3.x + p3.y) * p3.z);

  }

  float noise(vec2 p){

    vec2 i = floor(p);

    vec2 f = fract(p);

    // quintic smootherstep

    vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);

    float a = hash12(i);

    float b = hash12(i+vec2(1.0,0.0));

    float c = hash12(i+vec2(0.0,1.0));

    float d = hash12(i+vec2(1.0,1.0));

    return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);

  }



  mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }



  void main(){

    // pixel coords -> uv 0..1

    vec2 uv = gl_FragCoord.xy / u_res;



    // background outside nail (soft studio gradient)

    vec3 bg = mix(vec3(0.06,0.08,0.11), vec3(0.10,0.13,0.20), smoothstep(0.15, 0.85, uv.y));

    bg += 0.05*vec3(noise(uv*80.0)*0.15);



    // ---- Nail local space ----

    // center and aspect

    vec2 center = vec2(0.5, 0.56);

    vec2 p = uv - center;

    float aspect = u_res.x / u_res.y;

    p.x *= aspect;



    // Elliptical nail mask (rx,ry)

    float rx = 0.28;

    float ry = 0.43;

    vec2 e = vec2(p.x/rx, p.y/ry);

    float m = length(e); // ~1 at edge

    float edge = 0.006;  // feather

    float alpha = smoothstep(0.0, edge, 1.0 - m); // coverage inside the nail



    // Ambient occlusion: edge + cuticle base

    float ao_edge = pow(saturate(1.0 - m), 0.35);     // strong near rim

    float ao_cuticle = smoothstep(0.0, -0.55, e.y);   // darker near base (bottom)

    float AO = saturate(1.0 - (0.55*ao_edge + 0.35*ao_cuticle));



    // --- Gel body (depth) ---

    float gel = smoothstep(0.0, 0.85, 1.0 - m);

    vec3 base = mix(u_base_dark, u_base_tint, 0.35 + 0.4*gel);

    // subtle vertical tint gradient

    base *= 0.92 + 0.08*smoothstep(-0.7, 0.5, e.y);



    // --- Ridge (cat eye highlight) ---

    // Line distance along lateral direction (perp to angle)

    vec2 lateral = vec2(-sin(u_angle), cos(u_angle));

    float centerOffset = mix(-0.55, 0.55, u_pointer.x); // move by pointer x

    float d = dot(e, lateral) - centerOffset;           // signed distance in normalized nail units

    float sigma = u_sigma;                              

    float ridge = exp(-0.5 * (d/sigma)*(d/sigma));      // gaussian highlight

    // side shadow troughs

    float tpos = sigma * 1.7;

    float tw   = sigma * 0.65;

    float trough = exp(-0.5 * ( (d - tpos)/tw ) * ( (d - tpos)/tw ))

                 + exp(-0.5 * ( (d + tpos)/tw ) * ( (d + tpos)/tw ));



    // --- Metallic flakes (anisotropic, magnet-aligned) ---

    mat2 R = rot(u_angle);

    vec2 q = R * e;                 // align with magnetic direction

    vec2 aStretch = vec2(10.0, 1.8); // elongated flakes along direction

    float nA = noise(q*aStretch + vec2(u_time*0.20, -u_time*0.07));

    float nB = noise(q*aStretch*1.7 + vec2(-u_time*0.15, u_time*0.11) + 10.0);

    float flakesBright = smoothstep(0.72, 0.98, nA);

    float flakesDark   = smoothstep(0.02, 0.22, nB);



    // --- Clearcoat / Fresnel reflection ---

    // Fake curved normal (convex nail)

    vec3 N = normalize(vec3(e.x*0.85, e.y*1.1, 1.0));

    float fresnel = pow(1.0 - max(dot(N, vec3(0.0,0.0,1.0)), 0.0), u_fresnel_pow);

    // a soft diagonal studio-light sweep

    float studio = smoothstep(-0.35, 0.25, dot(normalize(vec2(0.7,-0.6)), e))

                 * (1.0 - smoothstep(0.28, 0.58, dot(normalize(vec2(0.7,-0.6)), e)));

    float clear = (0.28 + 0.72*fresnel) * (0.5 + 0.5*studio);



    // --- Compose ---

    vec3 col = base;

    // darken by troughs first (multiply-like)

    col *= (1.0 - u_trough_gain * trough * 0.8);



    // add ridge highlight (add/screen)

    col += u_gain * ridge * vec3(1.0);



    // add bright flakes & attenuate with dark flakes

    col += 0.22 * flakesBright;

    col *= (1.0 - 0.10 * flakesDark);



    // apply AO

    col *= AO;



    // clearcoat reflection on top

    col += u_clearcoat * clear;



    // vignette inside nail for depth

    col *= 0.98 + 0.02*smoothstep(0.0, 0.9, 1.0 - m);



    // final mix with background

    vec3 outCol = mix(bg, col, alpha);

    gl_FragColor = vec4(outCol, 1.0);

  }`;



  // ---------- GL setup ----------

  function compile(type, src){

    const s = gl.createShader(type);

    gl.shaderSource(s, src);

    gl.compileShader(s);

    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){

      console.error(gl.getShaderInfoLog(s));

      throw new Error('Shader compile error');

    }

    return s;

  }

  const vs = compile(gl.VERTEX_SHADER, vert);

  const fs = compile(gl.FRAGMENT_SHADER, frag);

  const prog = gl.createProgram();

  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);

  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){

    console.error(gl.getProgramInfoLog(prog));

    throw new Error('Program link error');

  }

  gl.useProgram(prog);



  // Fullscreen triangle

  const buf = gl.createBuffer();

  gl.bindBuffer(gl.ARRAY_BUFFER, buf);

  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

  const aPos = gl.getAttribLocation(prog, 'a_pos');

  gl.enableVertexAttribArray(aPos);

  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);



  // Uniforms

  const U = {

    res: gl.getUniformLocation(prog, 'u_res'),

    time: gl.getUniformLocation(prog, 'u_time'),

    pointer: gl.getUniformLocation(prog, 'u_pointer'),

    sigma: gl.getUniformLocation(prog, 'u_sigma'),

    gain: gl.getUniformLocation(prog, 'u_gain'),

    trough: gl.getUniformLocation(prog, 'u_trough_gain'),

    fresnel: gl.getUniformLocation(prog, 'u_fresnel_pow'),

    clear: gl.getUniformLocation(prog, 'u_clearcoat'),

    angle: gl.getUniformLocation(prog, 'u_angle'),

    baseDark: gl.getUniformLocation(prog, 'u_base_dark'),

    baseTint: gl.getUniformLocation(prog, 'u_base_tint'),

  };



  // Params (ปรับสีได้ตามต้องการ)

  let params = {

    baseDark: [0.02, 0.03, 0.05],      // พื้นดำอมฟ้า

    baseTint: [0.05, 0.12, 0.20],      // ชิมเมอร์น้ำเงินอมเขียว

    sigmaBase: 0.095,                  // ความกว้างแถบพื้นฐาน

    gainBase: 0.85,                    // ความเข้มแถบพื้นฐาน

    troughGain: 0.22,                  // ความเข้มเงาประกบ

    fresnelPow: 3.8,

    clearcoat: 0.28,

  };



  // Pointer state

  let pointer = { x:0.5, y:0.5, down:false };

  let last = { x:0.5, y:0.5, t:performance.now() };

  let velocity = 0;



  // Events

  function setFromEvent(e){

    const rect = canvas.getBoundingClientRect();

    const cx = ( (e.touches ? e.touches[0].clientX : e.clientX) - rect.left ) / rect.width;

    const cy = ( (e.touches ? e.touches[0].clientY : e.clientY) - rect.top  ) / rect.height;

    pointer.x = Math.max(0, Math.min(1, cx));

    pointer.y = Math.max(0, Math.min(1, cy));

  }

  canvas.addEventListener('pointerdown', e => { pointer.down=true; setFromEvent(e); });

  canvas.addEventListener('pointermove', e => { if(pointer.down){ setFromEvent(e); }});

  window.addEventListener('pointerup', () => pointer.down=false);

  canvas.addEventListener('touchstart', setFromEvent, {passive:true});

  canvas.addEventListener('touchmove',  setFromEvent, {passive:true});

  window.addEventListener('touchend', () => pointer.down=false);



  // Resize

  function resize(){

    const w = Math.min(window.innerWidth*0.9, 520);

    const h = w*1.45;

    canvas.width  = Math.round(w * dpr);

    canvas.height = Math.round(h * dpr);

    canvas.style.width = w+'px';

    canvas.style.height= h+'px';

    gl.viewport(0,0,canvas.width,canvas.height);

  }

  window.addEventListener('resize', resize);

  resize();



  // Render loop

  let start = performance.now();

  function frame(){

    const t = performance.now();

    const dt = Math.max(1, t - last.t);

    const speed = Math.hypot(pointer.x - last.x, pointer.y - last.y) / dt; // ~ movement per ms

    // smooth velocity (for sigma/gain modulation)

    velocity = velocity*0.85 + speed*0.15;

    last = {x:pointer.x, y:pointer.y, t};



    const time = (t - start)/1000;



    // Angle based on pointer Y (ลากทแยงเพื่อหมุนแนวแถบ)

    const angle = (pointer.y - 0.5) * 2.2; // ~ -1.1..1.1 rad



    // Sigma shrinks a bit when moving fast; gain bumps slightly

    const sigma = params.sigmaBase * (1.0 - Math.min(0.45, velocity*8.0));

    const gain  = params.gainBase  * (1.0 + Math.min(0.25, velocity*10.0));



    gl.useProgram(prog);

    gl.uniform2f(U.res, canvas.width, canvas.height);

    gl.uniform1f(U.time, time);

    gl.uniform2f(U.pointer, pointer.x, pointer.y);

    gl.uniform1f(U.sigma, sigma);

    gl.uniform1f(U.gain,  gain);

    gl.uniform1f(U.trough, params.troughGain);

    gl.uniform1f(U.fresnel, params.fresnelPow);

    gl.uniform1f(U.clear, params.clearcoat);

    gl.uniform1f(U.angle, angle);

    gl.uniform3f(U.baseDark, params.baseDark[0], params.baseDark[1], params.baseDark[2]);

    gl.uniform3f(U.baseTint, params.baseTint[0], params.baseTint[1], params.baseTint[2]);



    gl.drawArrays(gl.TRIANGLES, 0, 3);

    requestAnimationFrame(frame);

  }

  requestAnimationFrame(frame);



  // Optional: toggle color palettes with keyboard (1..3)

  window.addEventListener('keydown', (e)=>{

    if(e.key==='1'){ // Emerald green

      params.baseDark=[0.02,0.04,0.03]; params.baseTint=[0.06,0.22,0.12];

    }

    if(e.key==='2'){ // Amethyst purple

      params.baseDark=[0.03,0.02,0.05]; params.baseTint=[0.17,0.08,0.24];

    }

    if(e.key==='3'){ // Sapphire blue (default-ish)

      params.baseDark=[0.02,0.03,0.05]; params.baseTint=[0.05,0.12,0.20];

    }

  });

})();

</script>

</body>

</html>
